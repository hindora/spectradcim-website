<!doctype html>
<!-- Source of public/og.jpg, the picture shown when a page is shared. Open at 1200 x 630 and screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #16181d; color: #eef0f3; font-family: 'Lato', 'Segoe UI', sans-serif; position: relative; }
  .text { position: absolute; left: 64px; top: 56px; width: 520px; }
  .text img { height: 60px; width: auto; display: block; }
  .eyebrow { margin-top: 62px; font-weight: 700; font-size: 15px; letter-spacing: 0.3em; text-transform: uppercase; color: #4cc3ff; }
  h1 { margin-top: 18px; font-weight: 700; font-size: 54px; line-height: 1.15; color: #fff; }
  p { margin-top: 22px; font-size: 22px; line-height: 1.4; color: #b3b7bf; max-width: 21em; }
  .shot { position: absolute; left: 640px; top: 96px; width: 800px; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 8px; overflow: hidden; }
  .shot img { display: block; width: 100%; height: auto; }
  .note { position: absolute; left: 64px; bottom: 44px; font-size: 16px; color: #b3b7bf; }
  .bar { position: absolute; left: 0; bottom: 0; width: 100%; height: 8px; background: #2563eb; }
</style>
</head>
<body>
  <div class="text">
    <img src="../../public/brand/spectradcim-logo.webp" alt="" />
    <div class="eyebrow">Data center infrastructure management</div>
    <h1>Power, cooling and IT. One system, watched as one.</h1>
  </div>
  <div class="shot"><img src="../../public/shots/replay-bar.webp" alt="" /></div>
  <div class="note">Screen from the product, on a simulated estate</div>
  <div class="bar"></div>
</body>
</html>
